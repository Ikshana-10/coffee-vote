<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cozy Roast - Voting Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom smooth fade-in animation for list updates */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-[#FDFBF7] min-h-screen font-sans antialiased text-stone-800">

    <!-- Decorative Top Bar -->
    <div class="h-2 bg-gradient-to-r from-amber-700 via-amber-800 to-stone-900"></div>

    <div class="max-w-2xl mx-auto py-16 px-4">
        <!-- Cafe Header -->
        <header class="text-center mb-12">
            <span class="text-xs font-bold tracking-widest text-amber-700 uppercase bg-amber-50 px-3 py-1 rounded-full border border-amber-200/60">
                Local Database Active
            </span>
            <h1 class="text-4xl font-serif font-black text-stone-900 mt-3 tracking-tight">
                ☕ The Cozy Roast
            </h1>
            <p class="text-stone-500 mt-2 font-medium italic">
                "Cast your vote for the house favorite brew. Watch the board shift live."
            </p>
            <div class="w-24 h-1 bg-amber-800/20 mx-auto mt-6 rounded-full"></div>
        </header>

        <!-- Menu/Voting Board Container -->
        <div id="menu-container" class="space-y-4">
            <!-- Shimmer Loading State -->
            <div class="space-y-4 animate-pulse">
                <div class="h-24 bg-stone-200/60 rounded-2xl"></div>
                <div class="h-24 bg-stone-200/60 rounded-2xl"></div>
                <div class="h-24 bg-stone-200/60 rounded-2xl"></div>
            </div>
        </div>
    </div>

    <script>
        const menuContainer = document.getElementById('menu-container');

        // Fetch items from the backend database
        async function loadMenu() {
            try {
                const response = await fetch('/api/items');
                const result = await response.json();
                
                if (result.success) {
                    renderMenu(result.data);
                } else {
                    showError("Failed to fetch menu items from the ledger.");
                }
            } catch (error) {
                console.error("API Error:", error);
                showError("Unable to connect to the cafe backend server.");
            }
        }

        // Render coffee items with a modern cafe theme and animations
        function renderMenu(items) {
            if (items.length === 0) {
                menuContainer.innerHTML = `<p class="text-center text-stone-400 py-8">The menu is currently empty.</p>`;
                return;
            }

            // Calculate max votes to determine relative popularity bar width
            const maxVotes = Math.max(...items.map(item => item.votes), 1);

            menuContainer.innerHTML = ''; 
            
            items.forEach((item, index) => {
                // Calculate percentage width for the visual progress bar
                const popularityWidth = (item.votes / maxVotes) * 100;
                
                const card = document.createElement('div');
                // Added staggering delay entry look via CSS animation class
                card.className = "animate-fade-in bg-white p-6 rounded-2xl border border-stone-200/60 shadow-[0_4px_20px_-4px_rgba(120,110,90,0.08)] transition-all duration-300 hover:shadow-[0_10px_30px_-10px_rgba(120,110,90,0.15)] hover:scale-[1.01] hover:border-amber-700/20 flex flex-col sm:flex-row sm:items-center justify-between gap-4";
                
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm font-mono text-amber-800/40 font-bold">0${index + 1}</span>
                            <h3 class="text-xl font-bold text-stone-900 tracking-tight">${item.name}</h3>
                        </div>
                        
                        <!-- Visual Popularity Progress Bar -->
                        <div class="mt-3 w-full bg-stone-100 h-2 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-amber-600 to-amber-800 h-full rounded-full transition-all duration-700 ease-out" 
                                 style="width: ${popularityWidth}%">
                            </div>
                        </div>
                        
                        <p class="text-xs font-semibold text-stone-400 mt-2 uppercase tracking-wider">
                            Popularity: <span class="font-bold text-amber-800">${item.votes}</span> votes
                        </p>
                    </div>
                    
                    <button 
                        onclick="submitVote(${item.id}, this)"
                        class="bg-[#4A3525] hover:bg-[#36261A] active:scale-95 text-amber-50 font-semibold py-3 px-6 rounded-xl text-sm transition-all duration-200 shadow-sm shadow-stone-900/10 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-amber-700 focus:ring-offset-2">
                        <span>👍</span> Vote Brew
                    </button>
                `;
                menuContainer.appendChild(card);
            });
        }

        // Handle POST vote actions with button feedback animations
        async function submitVote(id, buttonEl) {
            // Visual feedback freeze to prevent spam clicking during processing
            buttonEl.disabled = true;
            buttonEl.innerHTML = `<span>⏳</span> Pouring...`;

            try {
                const response = await fetch(`/api/vote/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();

                if (result.success) {
                    // Re-fetch to rearrange items based on new rankings seamlessly
                    loadMenu();
                } else {
                    alert("Error processing your choice: " + result.error);
                    buttonEl.disabled = false;
                    buttonEl.innerHTML = `<span>👍</span> Vote Brew`;
                }
            } catch (error) {
                console.error("Vote failure:", error);
                alert("Network timeout. Could not save selection.");
                buttonEl.disabled = false;
                buttonEl.innerHTML = `<span>👍</span> Vote Brew`;
            }
        }

        function showError(message) {
            menuContainer.innerHTML = `
                <div class="bg-amber-50 border border-amber-200 text-amber-900 px-5 py-4 rounded-xl text-center font-medium shadow-sm">
                    ⚠️ ${message}
                </div>
            `;
        }

        // Run application
        loadMenu();
    </script>
</body>
</html>
